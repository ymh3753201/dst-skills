name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }} validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: plugins/dst-skills/skills/dst-skills/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r plugins/dst-skills/skills/dst-skills/requirements.txt

      - name: Validate repository and plugin structure
        run: python scripts/validate_repository.py

      - name: Run full Skill release checks
        run: python plugins/dst-skills/skills/dst-skills/scripts/validate_skill_release.py --full

      - name: Build and validate installable package
        run: |
          python scripts/package_skill.py --output dist/dst-skills.skill
          python scripts/validate_package.py dist/dst-skills.skill

      - name: Upload package
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: dst-skills-${{ github.sha }}
          path: dist/dst-skills.skill
          if-no-files-found: error
